<text x="195.0" y="212" font-size="12" fill="#475569" text-anchor="middle">empty chain · MeshError</text>
<rect x="420" y="120" width="300" height="180" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
