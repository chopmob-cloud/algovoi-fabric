<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="525" viewBox="0 0 1140 525" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"><rect width="1140" height="525" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs><text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Trust boundary — Rule K</text><text x="40" y="66" font-size="13" fill="#64748b">Every estate refusal is translated. Nothing leaks past except FabricError.</text><rect x="60" y="130" width="270" height="160" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
