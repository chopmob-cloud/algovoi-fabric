<text x="570.0" y="185" font-size="12" fill="#475569" text-anchor="middle">MeshError -&gt; FabricError</text>
<text x="570.0" y="202" font-size="12" fill="#475569" text-anchor="middle">TypeError -&gt; FabricError</text>
<text x="570.0" y="219" font-size="12" fill="#475569" text-anchor="middle">KeyError -&gt; FabricError</text>
