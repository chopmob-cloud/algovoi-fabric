[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-fabric"
version = "0.1.0"
description = "AlgoVoi Fabric: the highest-assurance security composition core for agentic commerce. Tamper-evident, fail-closed, offline-verifiable keystone chains binding PEF evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AlgoVoi" }]
dependencies = [
    "algovoi-keystone",
    "algovoi-pef>=0.1.2",
    "algovoi-substrate>=0.5.1",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "bandit", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]