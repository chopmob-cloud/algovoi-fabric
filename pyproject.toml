[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-fabric"
version = "0.3.1"
description = "AlgoVoi Fabric: the highest-assurance security composition core for agentic commerce. Tamper-evident, fail-closed, offline-verifiable journeys spanning AV-RAILS decisions, AV-PEF evidence, AV-VCS sealed-archive bindings and Algorand AC2 settlement consent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi" }]
dependencies = [
    "algovoi-keystone",
    "algovoi-pef>=0.1.2",
    "algovoi-substrate>=0.5.1",
    "algovoi-keystone-connect>=0.5.0",
    "rfc8785>=0.1.4",
    "avm-ac2>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "bandit", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]